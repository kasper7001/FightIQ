{% extends "predictions/base.html" %}

{% block content %}
<div class="card">
    <h2>Create a FightIQ account</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="button" type="submit">
            Create Account
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'predictions:login' %}">Log in</a>
    </p>
</div>
{% endblock %}
