<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FightIQ</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 32px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        nav {
            margin-top: 8px;
        }

        nav a {
            color: #d1d5db;
            margin-right: 16px;
            text-decoration: none;
        }

        nav a:hover {
            color: white;
        }

        main {
            padding: 32px;
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .muted {
            color: #6b7280;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #e5e7eb;
            font-size: 13px;
            margin-right: 6px;
        }

        .prediction {
            background: #ecfdf5;
            border-left: 4px solid #10b981;
            padding: 12px;
            margin-top: 12px;
        }

        .no-prediction {
            background: #fff7ed;
            border-left: 4px solid #f97316;
            padding: 12px;
            margin-top: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f9fafb;
        }

        tr:hover {
            background: #f9fafb;
        }
    </style>
</head>
<body>
    <header>
        <h1>FightIQ</h1>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'predictions:event_list' %}">
                    Events
                </a>

                <a href="{% url 'predictions:analytics_dashboard' %}">
                    Analytics
                </a>

                {% if user.is_staff %}
                    <a href="/admin/">Admin</a>
                {% endif %}

                <span>
                    Logged in as {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'predictions:logout' %}"
                    style="display: inline;"
                >
                    {% csrf_token %}

                    <button type="submit">
                        Logout
                    </button>
                </form>

            {% else %}
                <a href="{% url 'predictions:login' %}">
                    Login
                </a>

                <a href="{% url 'predictions:register' %}">
                    Register
                </a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
